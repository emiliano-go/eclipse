model:
  vocab_size: 260
  d_model: 576
  n_layers: 12
  n_heads: 9
  head_dim: 64
  ffn_hidden: 1536
  max_seq_len: 1024
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-6
  qk_norm: true
  tie_embeddings: true

train:
  objective: eot            # eot | mi | ce
  alpha: 1.0                # weight on KL; 1.0 = pure distillation
  lr: 3.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_fraction: 0.05
  min_lr_fraction: 0.1
  grad_clip: 1.0
  micro_batch: 32
  grad_accum: 1
  epochs: 12
  amp: true
  grad_checkpointing: false
  seed: 1337
  eval_every_steps: 200
  log_every_steps: 20
