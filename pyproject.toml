[project]
name = "eclipse"
version = "0.1.0"
description = "Byte-level EOT distillation rig for Ornith 1.5 9B"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "numpy",
    "tokenizers",
    "datasets",
    "tqdm",
    "PyYAML",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/byte_agent"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
